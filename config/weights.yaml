  start_l5: 0.55
  recency: 0.45
  fixture_lo: 0.85
  fixture_hi: 1.22
  assist: 3.0
  defcon: 2.0
  save_per_pt: 3.0
  # Poisson P(CS) overstates FPL CS (60+ mins, late goals). Attack stays unscaled.
  cs_scale: 0.65
  defcon_def: 1.5
  fwd_attack_scale: 1.10
  p90_residual: 0.18
  p90_residual_def: 0.08

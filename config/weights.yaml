# Point-unit forecast for XI / transfers (not a ranker).
# Attack uses per-match expected goals vs this opponent (by position).
# GK/DEF bonus follows P(CS); FWD/MID bonus follows attack tilt.
xpts:
  start_l5: 0.47
  recency: 0.45
  assist: 3.0
  defcon: 2.0
  defcon_mid: 1.15
  save_per_pt: 3.0
  # Poisson P(CS) overstates FPL CS (60+ mins, late goals). Attack stays unscaled.
  # 2024–26 walk-forward: xPts under-forecasts ~0.3–0.4/GW; nudge CS/residual/bonus
  # only (not overall_by_pos, not fwd_attack_scale).
  cs_scale: 0.55
  gk_cs_scale: 1.18
  defcon_def: 1.35
  fwd_attack_scale: 1.0
  gk_attack_scale: 0.12
  pen_xg90: 0.08
  p90_residual: 0.13
  p90_residual_def: 0.09
  bonus_scale: 0.60
  bps_scale: 0.12
  # GK saves: mix historical saves/90 with this match's expected goals against.
  save_hist: 0.45
  save_per_xg: 1.75
  # Set-piece xG is stickier (pens/corners) than open play.
  sp_goal_scale: 1.12
  bonus_fx: 0.22
  bonus_cs: 0.40
  card_yellow: 1.0

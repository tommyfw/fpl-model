[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fpl-model"
version = "0.1.0"
description = "Explainable FPL player suitability model with leakage-safe backtests"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "numpy>=2.0",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "scipy>=1.13",
  "lxml>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
fbref = ["playwright>=1.48"]

[project.scripts]
fpl-model = "fpl_model.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fpl_model = ["db/schema.sql", "ui/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
